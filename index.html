<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn CSS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="global-container">
        <div class="data-container">
            <header>
                <nav>
                    <div class="left-nav-segment">
                        <ul>
                            <li>
                                <div class="mr-logo">
                                    <p>MR</p>
                                </div>
                            </li>
                            <li>
                                <div class="left-nav-text-content">Vectors</div>
                            </li>
                            <li>
                                <div class="left-nav-text-content">Photos</div>
                            </li>
                            <li>
                                <div class="left-nav-text-content">PSD</div>
                            </li>
                            <li>
                                <div class="left-nav-text-content">Video</div>
                            </li>
                            <li>
                                <div class="left-nav-text-content">More &#9207;</div>
                            </li>
                        </ul>
                    </div>
                    <div class="right-nav-segment">
                        <ul>
                            <li>
                                <div class="right-nav-img-container">
                                    <img id="facebook-img" src="assets/images/facebook.png" alt="Facebook">
                                </div>
                            </li>
                            <li>
                                <div class="right-nav-img-container">
                                    <img id="gmail-img" src="assets/images/gmail.png" alt="Gmail">
                                </div>
                            </li>
                            <li>
                                <div class="right-nav-text-content">+Submit</div>
                            </li>
                        </ul>
                    </div>
                </nav>
            </header>
            <p id="content-heading">Popular Pro Stock Vectors</p>
            <p id="content-description">High Quality Vectors with worry-free licensing for personal and commercial use.
            </p>
            <div class="search-container">
                <div class="search-data-container">
                    <div class="vector-dropdown-box">Vectors &#9207;</div>
                    <p>Search Vectors...</p>
                    <img src="assets/icons/search.png" alt="Search Icon">
                </div>
            </div>
            <div class="article-navigation">
                <div class="article-left-navigation">
                    <p>
                        Latest <span id="red-dot"></span>
                    </p>
                    <p>Popular</p>
                    <p>|</p>
                    <p style="color: #a64532">Premium</p>
                    <p style="color :#526d9c">Free</p>
                </div>
                <div class="article-right-navigation">
                    <img src="assets/icons/filter.png" alt="">
                    <img src="assets/icons/bookmark.png" alt="">
                </div>
            </div>
            <div class="card-container">
                <div class="card dog"></div>
                <div class="card astronaut"></div>
                <div class="card rockstar"></div>
            </div>

            <footer></footer>
        </div>
    </div>
</body>

</html>
